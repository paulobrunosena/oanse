name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint e Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

  test:
    name: Testes (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test

  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

  database:
    name: Migrations + Seed + Asserts RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinado para CI reproduzível (mesma versão usada no desenvolvimento).
          version: 2.121.0

      - name: Subir stack Supabase local
        run: supabase start

      - name: Aplicar migrations + seed
        run: supabase db reset

      - name: Types em dia com o schema (drift check)
        run: |
          supabase gen types typescript --local > /tmp/types.gen.ts
          node scripts/comparar-types.mjs /tmp/types.gen.ts src/types/database.types.ts
          diff -q src/types/database.types.ts server/types/database.types.ts

      - name: Assert - todas as tabelas public com RLS habilitado
        run: |
          count=$(docker exec supabase_db_oanse psql -U postgres -tAc \
            "select count(*) from pg_tables where schemaname = 'public' and rowsecurity = false")
          echo "Tabelas sem RLS: $count"
          test "$count" = "0"

      - name: Assert - policies definidas em todas as tabelas
        run: |
          count=$(docker exec supabase_db_oanse psql -U postgres -tAc \
            "select count(*) from pg_tables t
             where t.schemaname = 'public'
               and not exists (
                 select 1 from pg_policies p
                 where p.schemaname = 'public' and p.tablename = t.tablename
               )")
          echo "Tabelas sem nenhuma policy: $count"
          test "$count" = "0"
