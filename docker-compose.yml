# ============================================================
# Oanse - Ambiente de Desenvolvimento Local
# Nuxt 4 (container) + Supabase local (via Supabase CLI)
#
# O stack do Supabase (Postgres, GoTrue/Auth, Realtime,
# PostgREST, Studio, Storage) é gerenciado pela CLI oficial,
# que publica as portas no host (54321 etc.). O serviço `nuxt`
# alcança o Supabase via host.docker.internal (Windows/Mac;
# no Linux é resolvido pelo extra_hosts abaixo).
#
# Uso:
#   1) npm install
#   2) npx supabase init        (primeira vez)
#   3) npx supabase start       (sobe o stack local do Supabase)
#   4) docker compose up nuxt   (sobe o frontend em http://localhost:3000)
# ============================================================

services:
  nuxt:
    image: node:22-alpine
    container_name: oanse-web
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Supabase local (credenciais padrão da CLI — NÃO usar em produção)
      # Chaves novas (formato sb_*), exibidas por `npx supabase status`.
      NUXT_PUBLIC_SUPABASE_URL: http://host.docker.internal:54321
      NUXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz}
      # Postgres direto (migrations/seed fora das migrations do Supabase)
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "(test -d node_modules/nuxt || npm install) && npm run dev"
    restart: unless-stopped

volumes:
  node_modules:
